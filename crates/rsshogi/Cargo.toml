[package]
name = "rsshogi"
version = "1.7.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Reusable Rust shogi primitives for board state, move generation, legality, and record parsing."
repository = "https://github.com/nyoki-mtl/rsshogi"
keywords = ["shogi"]
categories = ["games"]
exclude = [
    "src/bin/**",
    "examples/native_book_layout_probe.rs",
    "examples/native_book_measure.rs",
    "examples/native_book_ybb_verify.rs",
    "examples/sazpack_measure.rs",
    "examples/sbinpack_size_breakdown.rs",
    "examples/sbk_open_measure.rs",
]

# crates.io には本クレートを公開し、Python bindings は別パッケージで配布する。
publish = true

[dependencies]
thiserror = "2"
log = "0.4"
# 棋譜処理用の依存は、records feature を有効にした場合だけコンパイルする。
encoding_rs = { version = "0.8", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
ordered-float = { version = "4.6", optional = true }
zstd = { version = "0.13", optional = true, default-features = false }

[features]
default = []
hash-128 = []

# 棋譜、定跡、学習データ用の機能は用途に応じて個別に有効化する。

# policy-labels: labels::policy::CompactMoveLabel 等の Policy ラベル変換。
policy-labels = []

# position-serialization: packed_sfen / huffman_coded_pos / bit_io。records が require。
position-serialization = []

# svg: position::to_svg。
svg = []

# validation: position::validate / is_valid 等（impl block のみ。型は core）。
validation = []

# initial-positions: InitialPosition enum（駒落ち含む）。平手 SFEN は core 定数 STARTPOS_SFEN で供給。
initial-positions = []

# book: 定跡 I/O 全体。InitialPosition を使う。SBK/YBB 形式が PackedSfen を使うため
# position-serialization を require。NativeBookBuilder は順次入力から構築する。
book = ["initial-positions", "position-serialization", "dep:zstd"]

# records: 棋譜フォーマット I/O。sbinpack が packed_sfen/huffman を使うため position-serialization を、
# sazpack が labels::policy::CompactMoveLabel を使うため policy-labels を require。
# CSA/KIF/JKF/record が encoding_rs/serde/serde_json/ordered-float を dep: で引く。
records = [
    "position-serialization",
    "initial-positions",
    "policy-labels",
    "dep:encoding_rs",
    "dep:serde",
    "dep:serde_json",
    "dep:ordered-float",
]

# python-data: py が使う data ecosystem 一式。
# policy-labels は records が require するため python-data にも transitively 含まれる
# （独立 feature なので az は policy-labels 単独で有効化できる、という性質は不変）。
python-data = ["book", "records", "position-serialization", "svg", "validation"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.4", default-features = false, features = ["std"] }
# 統合テスト（tests/perft.rs・tests/movegen_integration.rs）が JSON 期待値の
# deserialize で使う。lib の serde は records feature の optional dep だが、テストは
# default feature でも走るため dev-dependency として常時利用可能にする。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[example]]
name = "native_book_measure"
# Python sdist にソースを含めない example も、Cargo の自動パス探索に依存させない。
path = "examples/native_book_measure.rs"
required-features = ["book", "validation"]

[[example]]
name = "native_book_layout_probe"
path = "examples/native_book_layout_probe.rs"
required-features = ["book", "records"]

[[example]]
name = "native_book_ybb_verify"
path = "examples/native_book_ybb_verify.rs"
required-features = ["book"]

[[bench]]
name = "apply_undo"
harness = false

[[bench]]
name = "movegen"
harness = false

[[bench]]
name = "mate"
harness = false

[[bench]]
name = "attack_tables"
harness = false

[[bench]]
name = "ki2"
harness = false

# data 系 API を使う example は records 有効時のみビルドする
# （default の `cargo test --no-run` で example が落ちないようにする）。
[[example]]
name = "sazpack_measure"
path = "examples/sazpack_measure.rs"
required-features = ["records"]

[[example]]
name = "sbinpack_size_breakdown"
path = "examples/sbinpack_size_breakdown.rs"
required-features = ["records"]

[[example]]
name = "sfen_roundtrip"
path = "examples/sfen_roundtrip.rs"

[[example]]
name = "sbk_open_measure"
path = "examples/sbk_open_measure.rs"
required-features = ["book"]
