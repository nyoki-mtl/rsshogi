[book]
title = "rsshogi マニュアル"
authors = ["rsshogi Developers"]
language = "ja"
description = "rsshogi の導入ガイド、Python API リファレンス、棋譜と定跡のフォーマット仕様、および内部アルゴリズムを解説する公式マニュアル。"

[build]
build-dir = "build"
create-missing = false

[output.html]
default-theme = "navy"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/nyoki-mtl/rsshogi"
additional-css = ["theme/custom.css"]

[output.html.print]
enable = false
